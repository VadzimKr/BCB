<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCB Links</title>
  <!-- Подключение шрифта Work Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Подключение файла стилей CSS -->
  <link rel="stylesheet" href="style.css">
  <!-- Подключение библиотеки иконок Lucide -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <!-- Подключение Tailwind CSS для служебных классов (flex, px-4 и т.д.) -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="w-full">
  <div class="stage w-full flex items-center justify-center px-4 py-10">
    <main class="phone" aria-label="BCB social links">
      <div class="phone-content">
        <header class="text-center">
          <header class="text-center">
            <div class="logo-container">
              <img src="logo.png" alt="BCB Community Logo" class="brand-logo">
            </div>
          <h1 class="canva-text mt-7 font-semibold tracking-tight">Знайдзі нас анлайн</h1>
          <p class="canva-text mt-2">Будзем на сувязі з BCB</p>
        </header>

        <nav aria-label="Social and website links" class="mt-11 flex flex-col gap-4">
          <a class="link-card flex items-center gap-5 px-6 no-underline" href="https://www.instagram.com/bcb_polska/" target="_blank" rel="noopener noreferrer">
            <i data-lucide="instagram" class="link-icon" aria-hidden="true"></i>
            <span class="canva-text font-semibold">Instagram</span>
          </a> 
          <a class="link-card flex items-center gap-5 px-6 no-underline" href="https://t.me/business2belarus" target="_blank" rel="noopener noreferrer">
            <i data-lucide="send" class="link-icon" aria-hidden="true"></i>
            <span class="canva-text font-semibold">Telegram</span>
          </a> 
          <a class="link-card flex items-center gap-5 px-6 no-underline" href="https://www.facebook.com/profile.php?id=100091953180111" target="_blank" rel="noopener noreferrer">
            <i data-lucide="facebook" class="link-icon" aria-hidden="true"></i>
            <span class="canva-text font-semibold">Facebook</span>
          </a> 
          <a class="link-card flex items-center gap-5 px-6 no-underline" href="https://www.linkedin.com/company/bcb-community" target="_blank" rel="noopener noreferrer">
            <i data-lucide="linkedin" class="link-icon" aria-hidden="true"></i>
            <span class="canva-text font-semibold">LinkedIn</span>
          </a> 
          <a class="link-card flex items-center gap-5 px-6 no-underline" href="https://bcb-community.org/" target="_blank" rel="noopener noreferrer">
            <i data-lucide="globe-2" class="link-icon" aria-hidden="true"></i>
            <span class="canva-text font-semibold">BCB website</span>
          </a>
        </nav>
      </div>
    </main>
  </div>

  <!-- Подключение файла скриптов JS -->
  <script src="script.js"></script>
</body>
</html>
